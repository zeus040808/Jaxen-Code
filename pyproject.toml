[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hh-agent-pro"
version = "2.0.0"
description = "从零实现的本地 coding agent harness，含可复现的企业式评测体系"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai==2.41.1",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.0"]

[project.scripts]
hh = "hh_agent_pro.cli:main"

[tool.setuptools]
# evaluation/ 是评测工具，随包一起分发以便 CI 直接调用；
# 它不参与 agent 运行时。
packages = [
    "hh_agent_pro",
    "hh_agent_pro.memory",
    "hh_agent_pro.skills",
    "hh_agent_pro.services",
    "hh_agent_pro.providers",
    "hh_agent_pro.evaluation",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
