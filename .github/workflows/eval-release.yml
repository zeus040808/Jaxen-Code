name: Eval Release

on:
  workflow_dispatch:
    inputs:
      baseline_path:
        description: Frozen Nightly baseline JSON in the repository
        required: true
        default: artifacts/eval-v2/baselines/nightly-v2.json

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      HH_DEEPSEEK_API_KEY: ${{ secrets.HH_DEEPSEEK_API_KEY }}
      HH_DEEPSEEK_API_BASE: ${{ secrets.HH_DEEPSEEK_API_BASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
          pnpm install --frozen-lockfile
      - name: Validate release inputs
        shell: bash
        run: |
          : "${HH_DEEPSEEK_API_KEY:?HH_DEEPSEEK_API_KEY secret is required}"
          test -f "${{ inputs.baseline_path }}"
      - name: Run all real tasks five times against baseline
        run: >-
          python scripts/eval/run_eval_profile.py release
          --platform linux
          --infra-retries 2
          --baseline "${{ inputs.baseline_path }}"
      - name: Upload Release record and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hh-agent-release-eval
          path: |
            artifacts/eval-v2/
            artifacts/deterministic/harness-regression-v2.json
            artifacts/deterministic/tool-contract-v1.json
            artifacts/deterministic/security-regression-v1.json
            .niceeval/
          retention-days: 90
